<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101317"><title>ParticleFun · Research Lab</title>
<link rel="stylesheet" href="./src/research.css"><script type="module" src="./src/research.js"></script></head>
<body>
<div id="app">
 <header id="tools" role="toolbar" aria-label="Laboratuvar">
  <strong id="logo">particlefun</strong>
  <button type="button" id="experiments">Deney ▾</button>
  <button type="button" id="species">Alan ▾</button>
  <label class="klabel" title="Başlangıç kinetik enerjisi, MeV. Kütlesiz alanlar için toplam enerji.">K <input type="number" id="kinetic" min="0" step="any" value="0"></label>
  <button type="button" id="add" title="Görünüm merkezine alan ekle">＋</button>
  <div class="sep"></div>
  <button type="button" id="back" title="Önceki simülasyon karesine dön [←]" aria-label="Bir kare geri">⟵</button>
  <button type="button" id="play" title="Başlat/durdur [Space]" aria-label="Başlat">▶</button>
  <button type="button" id="forward" title="Bir kare ileri [→]" aria-label="Bir kare ileri">⟶</button>
  <button type="button" id="slower" aria-label="Yavaşlat">−</button>
  <output id="speed">1×</output>
  <button type="button" id="faster" aria-label="Hızlandır">＋</button>
  <button type="button" id="restart" title="Seçili deneyi başlangıca döndür">↺</button>
  <button type="button" id="instrument" title="Serbest fotonu ilk aygıta fiziksel uçuş süresince ilerlet">⏭</button>
  <div class="sep"></div>
  <button type="button" id="view">Görünüm ▾</button>
  <button type="button" id="help">?</button>
 </header>
 <main id="workspace">
  <canvas id="plot" role="img" aria-label="Üç boyutlu fiziğin ayarlanabilir z kesitini, yörüngeleri ve deney aygıtlarını gösteren çizim"></canvas>
  <div id="sceneLabel">LAB</div>
  <div id="message" role="status" aria-live="polite"></div>
  <section id="popup" hidden aria-label="Açılır menü">
   <div class="popuphead"><strong id="popupTitle">Deneyler</strong><button type="button" id="popupClose" aria-label="Kapat">×</button></div>
   <div id="popupItems"></div>
   <div class="popupfoot"><button type="button" id="previous">‹</button><output id="page">1 / 1</output><button type="button" id="next">›</button></div>
  </section>
 </main>
 <footer id="status">
  <span id="simtime">t = 0 fm/c</span>
  <label id="zlabel">z = <output id="zvalue">0</output> fm
    <input id="slice" type="range" min="-52.5" max="52.5" step="any" value="0" aria-label="3B modelin z kesitini değiştir">
  </label>
  <span id="diagnostic">3D Lorentz + Coulomb · z kesiti</span>
  <span id="hint">Sürükle: pan · tekerlek: zoom · Space: ▶/Ⅱ</span>
 </footer>
</div></body></html>
