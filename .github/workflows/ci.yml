name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  physics-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in src/*.js tests/*.mjs; do node --check "$file"; done
      - name: Run physics regressions
        run: npm test
